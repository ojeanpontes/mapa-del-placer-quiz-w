<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Vídeo Online | VTurb</title>
    <meta
      name="description"
      content="Página pública para exibir um vídeo VTurb salvo no projeto."
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./video-online.css" />
  </head>
  <body class="video-online-page">
    <main class="video-online-shell">
      <section class="video-stage">
        <p class="video-eyebrow">Preview online</p>
        <h1 data-video-title>Carregando vídeo...</h1>
        <div class="player-box" data-player-box>
          <div class="player-empty">
            <strong>Buscando embed salvo.</strong>
            <span>Se o vídeo não abrir, volte no gerenciador e salve o embed novamente.</span>
          </div>
        </div>
      </section>
    </main>

    <script src="./video-online.js"></script>
  </body>
</html>
